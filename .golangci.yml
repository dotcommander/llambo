# Llambo per-repo lint config.
# Mirrors the workspace config at ~/code/go/src/.golangci.yml with llambo-specific,
# evidence-based adjustments. The workspace file no longer applies once this file
# exists; keep both synchronized when the workspace config changes.
#
# Per-repo decisions:
# - errcheck excludes fmt.Fprint/Fprintf/Fprintln: CLI presentation writes to
#   os.Stdout/os.Stderr whose errors are not actionable; non-display resource
#   errors (Close, file writes) remain checked.
# - gochecknoglobals disabled: llambo's package-level symbols are intentional
#   single-source registries and seams (error-pattern tables in
#   providers/errors_patterns.go, frozen eval reference tables, style
#   singletons, injectable fetch functions), matching the jinn precedent.

version: "2"

linters:
  enable:
    # Correctness
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    # Security
    - gosec
    # Architecture: depguard + forbidigo are per-repo only
    # Strict
    - gocritic
    - gocyclo
    - dupl
    # LLM-Friendly Clean Code
    - gocognit
    - funlen
    - nestif
    - goconst
    - gochecknoinits
    - revive
    # Resource Safety
    - bodyclose
    - sqlclosecheck
    - noctx
    # Error Handling
    - errorlint
    - nilerr
    # Correctness
    - exhaustive
    - unparam
    - unconvert
    - copyloopvar
    - fatcontext
    - nakedret
    # Performance
    - perfsprint
    # slog Hygiene
    - sloglint

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    nestif:
      min-complexity: 4
    goconst:
      min-len: 2
      min-occurrences: 3
    dupl:
      threshold: 100
    exhaustive:
      check:
        - switch
        - map
    nakedret:
      max-func-lines: 0
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation: [funlen, gocognit]
    perfsprint:
      strconcat: false
    sloglint:
      no-global: all
      context: scope
    gosec:
      excludes:
        - G104  # deferred .Close() on read-only file
        - G304  # validated path variables
    govet:
      enable:
        - shadow
    errcheck:
      exclude-functions:
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fscan
        - fmt.Fscanln
        - fmt.Fscanf
    revive:
      rules:
        - name: exported
        - name: unexported-return
        - name: indent-error-flow
        - name: var-naming
        - name: argument-limit
          arguments: [5]
        - name: function-result-limit
          arguments: [3]
        - name: cognitive-complexity
          arguments: [20]
        - name: empty-block
        - name: unnecessary-stmt
        - name: confusing-naming
        - name: confusing-results

  exclusions:
    paths:
      - vendor
      - generated
      - third_party
    rules:
      # Test files: relax noisy linters
      - path: _test\.go
        linters:
          - dupl
          - goconst
          - bodyclose
          - noctx
          - funlen
          - gosec

issues:
  max-issues-per-linter: 20
  max-same-issues: 5
